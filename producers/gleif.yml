- name: directChildrenOfLegalEntity
  kind: remote
  operation: gleifDirectChildren
  records: "$.data[*]"
  keyArgs: [lei]
  echoKeyAs: parentLei
  batchSafe: false
  args: { "page[size]": 200 }
  paging: { style: page, param: "page[number]", sizeParam: "page[size]", size: 200, maxPages: 5 }
  # The children endpoint takes no filters: it lists what the parent consolidates, and a question
  # that narrows the children does so in the graph. Declared empty on purpose.
  pushdown: []
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost: { bucket: gleif, rate: 4/sec, yield: high }
  project:
    lei: id
    legalName: attributes.entity.legalName.name
    otherNames: "attributes.entity.otherNames[*].name"
    jurisdiction: attributes.entity.jurisdiction
    status: attributes.entity.status
    category: attributes.entity.category
    legalForm: attributes.entity.legalForm.id
    country: attributes.entity.legalAddress.country
    city: attributes.entity.legalAddress.city
    registeredAs: attributes.entity.registeredAs
    registrationAuthority: attributes.entity.registeredAt.id
    creationDate: attributes.entity.creationDate
    registrationStatus: attributes.registration.status
    lastUpdated: attributes.registration.lastUpdateDate
  compute:
    names: "[r.legalName] + [n IN coalesce(r.otherNames, []) WHERE n IS NOT NULL AND n <> r.legalName]"

- name: consolidationOfLegalEntity
  kind: remote
  operation: gleifDirectParentRelationship
  records: "$"
  keyArgs: [lei]
  echoKeyAs: childLei
  batchSafe: false
  # A single related record, addressed by the child's LEI in the path: GLEIF takes no filter on it.
  pushdown: []
  emptyErrorPatterns: ["Related resource not found"]
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost: { bucket: gleif, rate: 4/sec, yield: high }
  project:
    id: data.id
    parentLei: data.attributes.relationship.endNode.id
    relationshipType: data.attributes.relationship.type
    status: data.attributes.relationship.status
    validFrom: data.attributes.validFrom
    validTo: data.attributes.validTo
    periodTypes: "data.attributes.relationship.periods[*].type"
    periodStarts: "data.attributes.relationship.periods[*].startDate"
    periodEnds: "data.attributes.relationship.periods[*].endDate"
    corroboration: data.attributes.registration.corroborationLevel
    corroborationDocuments: data.attributes.registration.corroborationDocuments
    lastUpdated: data.attributes.registration.lastUpdateDate
  compute:
    # The periods arrive as parallel lists; pick each kind by position (project takes paths, not filters).
    since: "head([i IN range(0, size(coalesce(r.periodTypes, [])) - 1) WHERE r.periodTypes[i] = 'RELATIONSHIP_PERIOD' | r.periodStarts[i]])"
    accountingPeriodStart: "head([i IN range(0, size(coalesce(r.periodTypes, [])) - 1) WHERE r.periodTypes[i] = 'ACCOUNTING_PERIOD' | r.periodStarts[i]])"
    accountingPeriodEnd: "head([i IN range(0, size(coalesce(r.periodTypes, [])) - 1) WHERE r.periodTypes[i] = 'ACCOUNTING_PERIOD' | r.periodEnds[i]])"

- name: reportingExceptionOfLegalEntity
  kind: remote
  operation: gleifDirectParentException
  records: "$"
  keyArgs: [lei]
  echoKeyAs: forLei
  batchSafe: false
  # A single related record, addressed by the child's LEI in the path: GLEIF takes no filter on it.
  pushdown: []
  emptyErrorPatterns: ["Related resource not found"]
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }
  cost: { bucket: gleif, rate: 4/sec, yield: high }
  project:
    id: data.id
    category: data.attributes.category
    reason: data.attributes.reason
    reference: data.attributes.reference
