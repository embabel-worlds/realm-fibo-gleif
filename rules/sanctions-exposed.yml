# The judgement that propagates down the chain: an entity is SanctionsExposed when one of its GLEIF
# names is on OFAC's SDN list (by primary name or alias), or when the entity it is consolidated by
# is SanctionsExposed. Two base clauses and one recursive one, to the fixpoint; `exposedVia` carries
# the listed name down so the conclusion names its reason. A reachability-only conclusion would be a
# path, not a rule (§13.5); this one is a rule because the base is a judgement (a name match of
# declared quality) and the recursion propagates it.
#
# Data contract: concluded over the edges a query has fetched. SanctionsExposureOf and
# CounterpartyExposure walk the chain and the name joins from their anchors, then name the label.
name: fibo-gleif/sanctions-exposed
derives: SanctionsExposed
description: >-
  A legal entity named on OFAC's SDN list under one of its GLEIF names, or consolidated (directly
  or through any number of parents) by one that is. `exposedVia` is the listed name, `matchedBy`
  how it matched: the SDN primary name or an alias. A name match is a lead, not a finding.
rules:
  - derive: "(e:SanctionsExposed {exposedVia: s.name, programme: s.program, matchedBy: 'legal name'})"
    from: |
      MATCH (e:LegalEntity)-[:NAMED_ON_SDN]->(s:SanctionedParty)
  - derive: "(e:SanctionsExposed {exposedVia: s.name, programme: s.program, matchedBy: 'alias ' + a.altName})"
    from: |
      MATCH (e:LegalEntity)-[:ALIAS_ON_SDN]->(a:SanctionsAlias)-[:ALIAS_OF]->(s:SanctionedParty)
  - derive: "(c:SanctionsExposed {exposedVia: p.exposedVia, programme: p.programme, matchedBy: 'parent ' + p.legalName})"
    from: |
      MATCH (c:LegalEntity)-[:IS_SUBSIDIARY_OF]->(p:SanctionsExposed)
